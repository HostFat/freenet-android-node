name: Diag River

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: [self-hosted, oracle]
    steps:
      - name: Read announcement state
        run: |
          echo '--- last-tag ---'
          cat /home/ubuntu/.config/unofficial-android/last-tag 2>/dev/null || echo missing
          echo '--- announce.log ---'
          tail -20 /home/ubuntu/.config/unofficial-android/announce.log 2>/dev/null || echo missing
          echo '--- node http ---'
          curl -s -o /dev/null -w '%{http_code}\n' --max-time 5 http://127.0.0.1:7509/ || true
          echo '--- files ---'
          ls -la /home/ubuntu/.config/unofficial-android/
