name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      freenet_core_version:
        description: "freenet-core ref to build against (e.g. v0.2.134)"
        required: true
        default: "v0.2.134"
      release_version:
        description: "App release version, no leading v (e.g. 0.2.0-beta.2)"
        required: true
      skip_prechecks:
        description: "Skip lint and debug APK (used by auto-bump). The release job still compiles native and signs the APK."
        type: boolean
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  FREENET_CORE_VERSION: "v0.2.134"
  DOCKER_IMAGE: freenet-android-node-dev

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      native: ${{ steps.result.outputs.native }}
      android: ${{ steps.result.outputs.android }}
    steps:
      - name: Checkout
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4

      - name: Filter paths
        if: github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            native:
              - 'native/**'
              - 'Dockerfile'
              - 'compose.yaml'
              - 'scripts/build-debug.sh'
              - 'scripts/build-native.sh'
              - 'scripts/build-release.sh'
              - 'scripts/check.sh'
              - 'scripts/check-freenet-baseline.sh'
              - 'scripts/bump-core-version.py'
              - 'scripts/cut-release.sh'
              - 'scripts/prepare-contract-fixture.sh'
              - '.github/workflows/ci.yml'
              - 'android/app/src/main/jniLibs/**'
              - 'android/**/*.gradle.kts'
              - 'android/**/*.gradle'
              - 'android/gradle/**'
              - 'android/gradlew'
              - 'android/gradlew.bat'
              - 'android/gradle.properties'
              - 'android/app/src/main/AndroidManifest.xml'
            android:
              - 'android/**'

      - name: Set outputs
        id: result
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "native=true" >> "$GITHUB_OUTPUT"
            echo "android=false" >> "$GITHUB_OUTPUT"
            echo "Non-PR event: full native CI"
            exit 0
          fi
          native="${{ steps.filter.outputs.native }}"
          android="${{ steps.filter.outputs.android }}"
          if [[ "${native}" == "true" ]]; then
            echo "native=true" >> "$GITHUB_OUTPUT"
            echo "android=false" >> "$GITHUB_OUTPUT"
            echo "PR touches native/NDK paths: full Docker+NDK CI"
          elif [[ "${android}" == "true" ]]; then
            echo "native=false" >> "$GITHUB_OUTPUT"
            echo "android=true" >> "$GITHUB_OUTPUT"
            echo "PR is Android/Kotlin only: Gradle unit tests, skip NDK"
          else
            echo "native=false" >> "$GITHUB_OUTPUT"
            echo "android=false" >> "$GITHUB_OUTPUT"
            echo "PR does not touch buildable paths: skip compile"
          fi

  setup:
    name: Setup & Build Docker
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.native == 'true'
    timeout-minutes: 30
    outputs:
      lock: ${{ steps.hash.outputs.lock }}
      freenet_core_version: ${{ steps.resolve-version.outputs.value }}

    steps:
      - name: Checkout freenet-android-node
        uses: actions/checkout@v4
        with:
          path: freenet-android-node

      - name: Resolve freenet-core version
        id: resolve-version
        run: echo "value=${{ github.event.inputs.freenet_core_version || env.FREENET_CORE_VERSION }}" >> "$GITHUB_OUTPUT"

      - name: Checkout freenet-core
        uses: actions/checkout@v4
        with:
          repository: freenet/freenet-core
          ref: ${{ steps.resolve-version.outputs.value }}
          path: freenet-core

      - name: Free disk space on runner
        run: |
          docker system prune -af --volumes
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/powershell

          echo "Disk space after cleanup:"
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and cache Docker image
        uses: docker/build-push-action@v5
        with:
          context: freenet-android-node
          push: false
          load: true
          tags: ${{ env.DOCKER_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save Docker image as artifact
        run: |
          docker save "${{ env.DOCKER_IMAGE }}" | gzip > freenet-docker-image.tar.gz

          echo "Image size:"
          du -sh freenet-docker-image.tar.gz

      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: freenet-docker-image
          path: freenet-docker-image.tar.gz
          retention-days: 1

      - name: Compute dependency lock hash
        id: hash
        run: |
          echo "lock=${{ hashFiles('**/Cargo.lock', '**/*.gradle*', '**/gradle-wrapper.properties', '**/Dockerfile') }}" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint & Test Rust
    runs-on: ubuntu-latest
    needs: [changes, setup]
    if: >
      needs.changes.outputs.native == 'true' &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.skip_prechecks != 'true')
    timeout-minutes: 90
    steps:
      - name: Free disk space on runner
        run: |
          docker system prune -af --volumes
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/powershell

          echo "Disk space after cleanup:"
          df -h /

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: freenet-docker-image

      - name: Load Docker image
        run: |
          docker load < freenet-docker-image.tar.gz

          echo "Loaded image:"
          docker images "${{ env.DOCKER_IMAGE }}"

      - name: Cache Cargo home
        uses: actions/cache@v4
        with:
          path: /tmp/.cargo-home
          key: ${{ runner.os }}-cargo-${{ needs.setup.outputs.lock }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache Rust build target
        uses: actions/cache@v4
        with:
          path: /tmp/.build-target
          key: ${{ runner.os }}-target-lint-${{ needs.setup.outputs.lock }}
          restore-keys: |
            ${{ runner.os }}-target-lint-

      - name: Checkout freenet-android-node
        uses: actions/checkout@v4
        with:
          path: freenet-android-node

      - name: Checkout freenet-core
        uses: actions/checkout@v4
        with:
          repository: freenet/freenet-core
          ref: ${{ needs.setup.outputs.freenet_core_version }}
          path: freenet-core

      - name: Prepare writable bind mounts
        run: |
          mkdir -p \
            /tmp/.cargo-home \
            /tmp/.build-target

          sudo chown -R "$(id -u):$(id -g)" \
            /tmp/.cargo-home \
            /tmp/.build-target

          chmod -R u+rwX \
            /tmp/.cargo-home \
            /tmp/.build-target

          echo "Runner identity:"
          id

          echo "Bind-mount ownership:"
          stat -c '%u:%g %a %n' \
            /tmp/.cargo-home \
            /tmp/.build-target \
            "$GITHUB_WORKSPACE/freenet-android-node" \
            "$GITHUB_WORKSPACE/freenet-core"

      - name: Run lint and tests
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=${GITHUB_WORKSPACE}/freenet-android-node,dst=/workspace/freenet-android-node" \
            --mount "type=bind,src=${GITHUB_WORKSPACE}/freenet-core,dst=/workspace/freenet-core" \
            --mount "type=bind,src=/tmp/.cargo-home,dst=/workspace/cache/cargo" \
            --mount "type=bind,src=/tmp/.build-target,dst=/workspace/target/cargo" \
            --env HOME=/tmp \
            --env JAVA_TOOL_OPTIONS=-Duser.home=/tmp \
            --env CARGO_HOME=/workspace/cache/cargo \
            --env CARGO_TARGET_DIR=/workspace/target/cargo \
            --env ANDROID_USER_HOME=/tmp/android-user \
            "${{ env.DOCKER_IMAGE }}" \
            bash -lc '
              set -euo pipefail

              mkdir -p "$HOME/.android" "$ANDROID_USER_HOME"

              if [[ ! -f "$HOME/.android/debug.keystore" ]]; then
                echo "Creating Android debug keystore..."

                keytool -genkeypair \
                  -keystore "$HOME/.android/debug.keystore" \
                  -storepass android \
                  -alias androiddebugkey \
                  -keypass android \
                  -keyalg RSA \
                  -keysize 2048 \
                  -validity 10000 \
                  -dname "CN=Android Debug,O=Android,C=US"
              fi

              cd /workspace/freenet-android-node
              ./scripts/check.sh
            '

  build:
    name: Build APK
    runs-on: ubuntu-latest
    needs: [changes, setup]
    if: >
      needs.changes.outputs.native == 'true' &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.skip_prechecks != 'true')
    timeout-minutes: 60
    steps:
      - name: Free disk space on runner
        run: |
          docker system prune -af --volumes
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/powershell

          echo "Disk space after cleanup:"
          df -h /

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: freenet-docker-image

      - name: Load Docker image
        run: |
          docker load < freenet-docker-image.tar.gz

          echo "Loaded image:"
          docker images "${{ env.DOCKER_IMAGE }}"

      - name: Cache Cargo home
        uses: actions/cache@v4
        with:
          path: /tmp/.cargo-home
          key: ${{ runner.os }}-cargo-${{ needs.setup.outputs.lock }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: /tmp/.gradle-cache
          key: ${{ runner.os }}-gradle-${{ needs.setup.outputs.lock }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache Rust build target
        uses: actions/cache@v4
        with:
          path: /tmp/.build-target
          key: ${{ runner.os }}-target-build-${{ needs.setup.outputs.lock }}
          restore-keys: |
            ${{ runner.os }}-target-build-

      - name: Checkout freenet-android-node
        uses: actions/checkout@v4
        with:
          path: freenet-android-node

      - name: Checkout freenet-core
        uses: actions/checkout@v4
        with:
          repository: freenet/freenet-core
          ref: ${{ needs.setup.outputs.freenet_core_version }}
          path: freenet-core

      - name: Prepare writable bind mounts
        run: |
          mkdir -p \
            /tmp/.cargo-home \
            /tmp/.gradle-cache \
            /tmp/.build-target

          sudo chown -R "$(id -u):$(id -g)" \
            /tmp/.cargo-home \
            /tmp/.gradle-cache \
            /tmp/.build-target

          chmod -R u+rwX \
            /tmp/.cargo-home \
            /tmp/.gradle-cache \
            /tmp/.build-target

          echo "Runner identity:"
          id

          echo "Bind-mount ownership:"
          stat -c '%u:%g %a %n' \
            /tmp/.cargo-home \
            /tmp/.gradle-cache \
            /tmp/.build-target \
            "$GITHUB_WORKSPACE/freenet-android-node" \
            "$GITHUB_WORKSPACE/freenet-core"

      - name: Build debug APK
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=${GITHUB_WORKSPACE}/freenet-android-node,dst=/workspace/freenet-android-node" \
            --mount "type=bind,src=${GITHUB_WORKSPACE}/freenet-core,dst=/workspace/freenet-core" \
            --mount "type=bind,src=/tmp/.cargo-home,dst=/workspace/cache/cargo" \
            --mount "type=bind,src=/tmp/.gradle-cache,dst=/workspace/cache/gradle" \
            --mount "type=bind,src=/tmp/.build-target,dst=/workspace/target/cargo" \
            --env HOME=/workspace/cache/gradle \
            --env JAVA_TOOL_OPTIONS=-Duser.home=/workspace/cache/gradle \
            --env CARGO_HOME=/workspace/cache/cargo \
            --env CARGO_TARGET_DIR=/workspace/target/cargo \
            --env GRADLE_USER_HOME=/workspace/cache/gradle \
            --env ANDROID_USER_HOME=/workspace/cache/gradle/android-user \
            "${{ env.DOCKER_IMAGE }}" \
            bash -lc '
            set -euo pipefail
      
              echo "Container identity:"
              id
      
              echo "Shell HOME: $HOME"
              java -XshowSettings:properties -version 2>&1 \
                | grep -E "^[[:space:]]*user.home"
      
              mkdir -p \
                "$HOME/.android" \
                "$ANDROID_USER_HOME"
      
              if [[ ! -f "$HOME/.android/debug.keystore" ]]; then
                echo "Creating Android debug keystore..."
      
                keytool -genkeypair \
                  -keystore "$HOME/.android/debug.keystore" \
                  -storepass android \
                  -alias androiddebugkey \
                  -keypass android \
                  -keyalg RSA \
                  -keysize 2048 \
                  -validity 10000 \
                  -dname "CN=Android Debug,O=Android,C=US"
              fi
      
              echo "Debug keystore:"
              ls -l "$HOME/.android/debug.keystore"
      
              cd /workspace/freenet-android-node
              ./scripts/build-debug.sh
            '

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: freenet-android-debug
          path: |
            freenet-android-node/android/app/build/outputs/apk/debug/app-debug.apk
            freenet-android-node/android/app/src/main/jniLibs/
          if-no-files-found: error
          retention-days: 14

  android-unit:
    name: Android unit tests
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.android == 'true'
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-unit-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-unit-

      - name: Gradle unit tests
        working-directory: android
        run: ./gradlew --no-daemon :app:testDebugUnitTest

  pr-gate:
    name: PR checks
    runs-on: ubuntu-latest
    needs: [changes, setup, lint, build, android-unit]
    if: always() && !cancelled() && github.event_name == 'pull_request'
    timeout-minutes: 5
    steps:
      - name: Require the jobs this PR selected
        run: |
          set -euo pipefail
          fail=0
          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            echo "changes: ${{ needs.changes.result }}"
            fail=1
          fi
          if [[ "${{ needs.changes.outputs.native }}" == "true" ]]; then
            for pair in "setup:${{ needs.setup.result }}" "lint:${{ needs.lint.result }}" "build:${{ needs.build.result }}"; do
              job="${pair%%:*}"
              result="${pair#*:}"
              if [[ "${result}" != "success" ]]; then
                echo "${job}: ${result}"
                fail=1
              fi
            done
          fi
          if [[ "${{ needs.changes.outputs.android }}" == "true" ]]; then
            if [[ "${{ needs.android-unit.result }}" != "success" ]]; then
              echo "android-unit: ${{ needs.android-unit.result }}"
              fail=1
            fi
          fi
          if [[ "${fail}" -ne 0 ]]; then
            exit 1
          fi
          echo "PR checks passed (native=${{ needs.changes.outputs.native }} android=${{ needs.changes.outputs.android }})"

  release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest
    needs: [setup, lint, build]
    if: >
      always() &&
      !cancelled() &&
      github.event_name == 'workflow_dispatch' &&
      needs.setup.result == 'success' &&
      (needs.lint.result == 'success' || needs.lint.result == 'skipped') &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    timeout-minutes: 60
    permissions:
      contents: write
      issues: write
    steps:
      - name: Free disk space on runner
        run: |
          docker system prune -af --volumes
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/powershell

          echo "Disk space after cleanup:"
          df -h /

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: freenet-docker-image

      - name: Load Docker image
        run: |
          docker load < freenet-docker-image.tar.gz

          echo "Loaded image:"
          docker images "${{ env.DOCKER_IMAGE }}"

      - name: Cache Cargo home
        uses: actions/cache@v4
        with:
          path: /tmp/.cargo-home
          key: ${{ runner.os }}-cargo-${{ needs.setup.outputs.lock }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache Rust build target
        uses: actions/cache@v4
        with:
          path: /tmp/.build-target
          key: ${{ runner.os }}-target-release-${{ needs.setup.outputs.lock }}
          restore-keys: |
            ${{ runner.os }}-target-release-

      - name: Checkout freenet-android-node
        uses: actions/checkout@v4
        with:
          path: freenet-android-node

      - name: Checkout freenet-core
        uses: actions/checkout@v4
        with:
          repository: freenet/freenet-core
          ref: ${{ needs.setup.outputs.freenet_core_version }}
          path: freenet-core

      - name: Decode release keystore
        run: |
          mkdir -p /tmp/.release-keystore
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > /tmp/.release-keystore/release.keystore
          chmod 600 /tmp/.release-keystore/release.keystore

      - name: Prepare writable bind mounts
        run: |
          mkdir -p \
            /tmp/.cargo-home \
            /tmp/.build-target

          sudo chown -R "$(id -u):$(id -g)" \
            /tmp/.cargo-home \
            /tmp/.build-target

          chmod -R u+rwX \
            /tmp/.cargo-home \
            /tmp/.build-target

          echo "Runner identity:"
          id

          echo "Bind-mount ownership:"
          stat -c '%u:%g %a %n' \
            /tmp/.cargo-home \
            /tmp/.build-target \
            /tmp/.release-keystore/release.keystore \
            "$GITHUB_WORKSPACE/freenet-android-node" \
            "$GITHUB_WORKSPACE/freenet-core"

      - name: Build & sign release APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=${GITHUB_WORKSPACE}/freenet-android-node,dst=/workspace/freenet-android-node" \
            --mount "type=bind,src=${GITHUB_WORKSPACE}/freenet-core,dst=/workspace/freenet-core" \
            --mount "type=bind,src=/tmp/.cargo-home,dst=/workspace/cache/cargo" \
            --mount "type=bind,src=/tmp/.build-target,dst=/workspace/target/cargo" \
            --mount "type=bind,src=/tmp/.release-keystore/release.keystore,dst=/workspace/release.keystore,readonly" \
            --env HOME=/tmp \
            --env JAVA_TOOL_OPTIONS=-Duser.home=/tmp \
            --env CARGO_HOME=/workspace/cache/cargo \
            --env CARGO_TARGET_DIR=/workspace/target/cargo \
            --env RELEASE_KEYSTORE_PATH=/workspace/release.keystore \
            --env RELEASE_KEYSTORE_PASSWORD="${RELEASE_KEYSTORE_PASSWORD}" \
            --env RELEASE_KEY_ALIAS="${RELEASE_KEY_ALIAS}" \
            --env RELEASE_KEY_PASSWORD="${RELEASE_KEY_PASSWORD}" \
            --env APP_VERSION_CODE="${{ github.run_number }}" \
            --env APP_VERSION_NAME="${{ github.event.inputs.release_version }}" \
            "${{ env.DOCKER_IMAGE }}" \
            bash -lc '
              set -euo pipefail
              cd /workspace/freenet-android-node
              ./scripts/build-release.sh

              echo "Verifying release APK signature:"
              "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs \
                artifacts/apk/freenet-android-node-release.apk
            '

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: freenet-android-release
          path: |
            freenet-android-node/artifacts/apk/freenet-android-node-release.apk
            freenet-android-node/artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.release_version }}
          name: v${{ github.event.inputs.release_version }}
          body: |
            App version: ${{ github.event.inputs.release_version }}
            freenet-core: ${{ needs.setup.outputs.freenet_core_version }}
          files: |
            freenet-android-node/artifacts/apk/freenet-android-node-release.apk
            freenet-android-node/artifacts/SHA256SUMS.txt

      - name: Open an issue if the release build failed
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          title="APK release failed for v${{ github.event.inputs.release_version }}"
          existing="$(gh issue list --repo "${{ github.repository }}" --state open --search "in:title ${title}" --json number --jq '.[0].number' || true)"
          body="$(cat <<EOF
          The signed APK release job failed.

          - Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          - App version: ${{ github.event.inputs.release_version }}
          - freenet-core: ${{ needs.setup.outputs.freenet_core_version }}

          Typical causes: Freenet core API change that the JNI adapter cannot compile,
          NDK/link failure, missing signing secrets, or a Docker image problem.
          The APK was **not** published.
          EOF
          )"
          if [[ -n "${existing}" ]]; then
            gh issue comment "${existing}" --repo "${{ github.repository }}" --body "${body}"
          else
            gh issue create --repo "${{ github.repository }}" --title "${title}" --body "${body}" --assignee HostFat
          fi
